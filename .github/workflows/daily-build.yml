name: hdf5 plugins daily build

# Triggers the workflow on a pull request or on demand
on:
  workflow_dispatch:
    inputs:
      use_ignore:
        description: 'Ignore has_changes check'
        type: string
        required: false
        default: check
      win_asset_suffix:
        description: 'HDF5 Windows release asset suffix (platform, version, compiler)'
        type: string
        required: false
        default: win-vs2026_cl
      mac_asset_suffix:
        description: 'HDF5 MacOS release asset suffix (platform, version, compiler)'
        type: string
        required: false
        default: macos15_clang
      ubuntu_asset_suffix:
        description: 'HDF5 Ubuntu release asset suffix (platform, version, compiler)'
        type: string
        required: false
        default: ubuntu-2404_gcc
  pull_request:
    branches: [ "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  get-asset-suffixes:
    runs-on: ubuntu-latest
    outputs:
      win-asset-suffix: ${{ steps.setassetsuffixes.outputs.WINASSETSUFFIX }}
      mac-asset-suffix: ${{ steps.setassetsuffixes.outputs.MACASSETSUFFIX }}
      ubuntu-asset-suffix: ${{ steps.setassetsuffixes.outputs.UBUNTUASSETSUFFIX }}

    steps:
    - id: setassetsuffixes
      run: |
        INPUT_VAL=${{ inputs.win_asset_suffix }}
        echo "WINASSETSUFFIX=${INPUT_VAL:-"win-vs2026_cl"}" >> "$GITHUB_OUTPUT"
        INPUT_VAL=${{ inputs.mac_asset_suffix }}
        echo "MACASSETSUFFIX=${INPUT_VAL:-"macos15_clang"}" >> "$GITHUB_OUTPUT"
        INPUT_VAL=${{ inputs.ubuntu_asset_suffix }}
        echo "UBUNTUASSETSUFFIX=${INPUT_VAL:-"ubuntu-2404_gcc"}" >> "$GITHUB_OUTPUT"

  get-old-names:
    runs-on: ubuntu-latest
    outputs:
      hdf5-name: ${{ steps.gethdf5base.outputs.HDF5_NAME_BASE }}
      plugin-name: ${{ steps.getpluginbase.outputs.PLUGIN_NAME_BASE }}
      run-ignore: ${{ steps.getinputs.outputs.INPUTS_IGNORE }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Get hdf5 release base name
      uses: robinraju/release-downloader@v1
      with:
        repository: 'HDFGroup/hdf5'
        tag: 'snapshot'
        fileName: 'last-file.txt'
        token: ${{ github.token }}

    - name: Read HDF5 base-name file
      id: gethdf5base
      run: echo "HDF5_NAME_BASE=$(cat last-file.txt)" >> $GITHUB_OUTPUT

    - run: echo "hdf5 base name is ${{ steps.gethdf5base.outputs.HDF5_NAME_BASE }}."

    - name: Get plugin release base name
      uses: robinraju/release-downloader@v1
      with:
        repository: 'HDFGroup/hdf5_plugins'
        tag: 'snapshot'
        fileName: 'last-file.txt'
        token: ${{ github.token }}

    - name: Read base-name file
      id: getpluginbase
      run: echo "PLUGIN_NAME_BASE=$(cat last-file.txt)" >> $GITHUB_OUTPUT

    - run: echo "plugin base name is ${{ steps.getpluginbase.outputs.PLUGIN_NAME_BASE }}."

    - name: Read inputs
      id: getinputs
      run: |
        echo "INPUTS_IGNORE=${{ inputs.use_ignore || 'check' }}" >> $GITHUB_OUTPUT

    - run: echo "use_ignore is ${{ steps.getinputs.outputs.INPUTS_IGNORE }}."

  call-workflow-tarball:
    needs: [get-old-names]
    uses: ./.github/workflows/tarball.yml
    with:
      use_ignore: ${{ needs.get-old-names.outputs.run-ignore }}
      use_tag: snapshot
      use_environ: snapshots

  call-workflow-c-script:
    needs: [get-asset-suffixes, get-old-names, call-workflow-tarball]
    uses: ./.github/workflows/cmake-script.yml
    with:
      cmake_version: "latest"
      file_base: ${{ needs.call-workflow-tarball.outputs.file_base }}
      win_asset_suffix: ${{ needs.get-asset-suffixes.outputs.win-asset-suffix }}
      mac_asset_suffix: ${{ needs.get-asset-suffixes.outputs.mac-asset-suffix }}
      ubuntu_asset_suffix: ${{ needs.get-asset-suffixes.outputs.ubuntu-asset-suffix }}
      use_hdf: ${{ needs.get-old-names.outputs.hdf5-name }}
      use_environ: snapshots
    if: ${{ (github.event_name != 'pull_request') && ((needs.call-workflow-tarball.outputs.has_changes == 'true') || (needs.get-old-names.outputs.run-ignore == 'ignore')) }}

  call-workflow-ctest:
    needs: [get-asset-suffixes, get-old-names, call-workflow-tarball]
    uses: ./.github/workflows/cmake-ctest.yml
    with:
      cmake_version: 'latest'
      preset_name: ci-StdShar
      file_base: ${{ needs.call-workflow-tarball.outputs.file_base }}
      use_hdf: ${{ needs.get-old-names.outputs.hdf5-name }}
      win_asset_suffix: ${{ needs.get-asset-suffixes.outputs.win-asset-suffix }}
      mac_asset_suffix: ${{ needs.get-asset-suffixes.outputs.mac-asset-suffix }}
      ubuntu_asset_suffix: ${{ needs.get-asset-suffixes.outputs.ubuntu-asset-suffix }}
#      use_tag: snapshot
      use_environ: snapshots
    secrets:
        APPLE_CERTS_BASE64: ${{ secrets.APPLE_CERTS_BASE64 }}
        APPLE_CERTS_BASE64_PASSWD: ${{ secrets.APPLE_CERTS_BASE64_PASSWD }}
        KEYCHAIN_PASSWD: ${{ secrets.KEYCHAIN_PASSWD }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
        AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
        AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
    if: ${{ ((needs.call-workflow-tarball.outputs.has_changes == 'true') || (needs.get-old-names.outputs.run-ignore == 'ignore')) }}

  call-release-bintest:
    name: "CMake Test Release Binaries"
    needs: [get-asset-suffixes, get-old-names, call-workflow-tarball, call-workflow-ctest]
    uses: ./.github/workflows/cmake-bintest.yml
    with:
      preset_name: ci-StdShar
      use_hdf: ${{ needs.get-old-names.outputs.hdf5-name }}
      file_base: ${{ needs.call-workflow-tarball.outputs.file_base }}
      win_asset_suffix: ${{ needs.get-asset-suffixes.outputs.win-asset-suffix }}
      mac_asset_suffix: ${{ needs.get-asset-suffixes.outputs.mac-asset-suffix }}
      ubuntu_asset_suffix: ${{ needs.get-asset-suffixes.outputs.ubuntu-asset-suffix }}
      use_environ: snapshots
    if: ${{ github.event_name != 'pull_request' }}

  call-workflow-release:
    needs: [get-asset-suffixes, get-old-names, call-workflow-tarball, call-workflow-ctest]
    permissions:
      contents: write # In order to allow tag creation
    uses: ./.github/workflows/release-files.yml
    with:
      file_base: ${{ needs.call-workflow-tarball.outputs.file_base }}
      file_branch: ${{ needs.call-workflow-tarball.outputs.file_branch }}
      file_sha: ${{ needs.call-workflow-tarball.outputs.file_sha }}
      win_asset_suffix: ${{ needs.get-asset-suffixes.outputs.win-asset-suffix }}
      mac_asset_suffix: ${{ needs.get-asset-suffixes.outputs.mac-asset-suffix }}
      ubuntu_asset_suffix: ${{ needs.get-asset-suffixes.outputs.ubuntu-asset-suffix }}
      use_tag: snapshot
      use_environ: snapshots
    if: ${{ (github.event_name != 'pull_request') && ((needs.call-workflow-tarball.outputs.has_changes == 'true') || (needs.get-old-names.outputs.run-ignore == 'ignore')) }}

  call-workflow-remove:
    needs: [get-asset-suffixes, get-old-names, call-workflow-tarball, call-workflow-ctest, call-workflow-release]
    permissions:
      contents: write # In order to allow file deletion
    uses: ./.github/workflows/remove-files.yml
    with:
      file_base: ${{ needs.get-old-names.outputs.plugin-name }}
      win_asset_suffix: ${{ needs.get-asset-suffixes.outputs.win-asset-suffix }}
      mac_asset_suffix: ${{ needs.get-asset-suffixes.outputs.mac-asset-suffix }}
      ubuntu_asset_suffix: ${{ needs.get-asset-suffixes.outputs.ubuntu-asset-suffix }}
      use_tag: snapshot
      use_environ: snapshots
    if: ${{ (github.event_name != 'pull_request') && ((needs.call-workflow-tarball.outputs.has_changes == 'true') || (needs.get-old-names.outputs.run-ignore == 'ignore')) && (needs.get-old-names.outputs.hdf5-name != needs.call-workflow-tarball.outputs.file_base) }}

  call-workflow-versions:
    uses: ./.github/workflows/check-releases.yml

