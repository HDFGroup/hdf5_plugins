name: hdf5 plugins release-files

# Triggers the workflow on a call from another workflow
on:
  workflow_call:
    inputs:
      use_tag:
        description: 'Release version tag'
        type: string
        required: false
        default: snapshot
      use_environ:
        description: 'Environment to locate files'
        type: string
        required: true
        default: snapshots
      file_base:
        description: "The common base name of the source tarballs"
        required: true
        type: string
      file_branch:
        description: "The branch name for the source tarballs"
        required: true
        type: string
      file_sha:
        description: "The sha for the source tarballs"
        required: true
        type: string
      win_asset_suffix:
        description: 'HDF5 Windows release asset suffix (platform, version, compiler)'
        type: string
        required: true
      mac_asset_suffix:
        description: 'HDF5 MacOS release asset suffix (platform, version, compiler)'
        type: string
        required: true
      ubuntu_asset_suffix:
        description: 'HDF5 Ubuntu release asset suffix (platform, version, compiler)'
        type: string
        required: true

# Minimal permissions to be inherited by any job that doesn't declare its own permissions
permissions:
  contents: read

# Previous workflows must pass to get here so tag the commit that created the files
jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
        contents: write # In order to allow tag creation
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Get Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: '${{ github.head_ref || github.ref_name }}'

      - name: Get Commit
        if: ${{ (inputs.use_environ == 'snapshots') }}
        run: |
          git checkout ${{ inputs.file_sha }}

      - uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72 # v1.7.2
        id: "tag_create"
        with:
          commit_sha: ${{ inputs.file_sha }}
          tag: "${{ inputs.use_tag }}"
          force_push_tag: true
          message: "Latest snapshot"
        if: ${{ inputs.use_environ == 'snapshots' }}

      # Print result using the action output.
      - run: |
          echo "Tag already present: ${{ steps.tag_create.outputs.tag_exists }}"

  PreRelease-getfiles:
    runs-on: ubuntu-latest
    needs: create-tag
    environment: ${{ inputs.use_environ }}
    permissions:
        contents: write
    steps:
      - name: Get file base name
        id: get-file-base
        run: |
          FILE_NAME_BASE=$(echo "${{ inputs.file_base }}")
          echo "FILE_BASE=$FILE_NAME_BASE" >> $GITHUB_OUTPUT

      # Get files created by tarball script
      - name: Get tgz-tarball (Linux)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
              name: tgz-tarball
              path: ${{ github.workspace }}

      - name: Get zip-tarball (Windows)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
              name: zip-tarball
              path: ${{ github.workspace }}

      # Get files created by cmake-ctest script
      - name: Get published binary (Windows)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
              name: zip-${{ inputs.win_asset_suffix }}-binary
              path: ${{ github.workspace }}

      - name: Get published msi binary (Windows)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
              name: msi-${{ inputs.win_asset_suffix }}-binary
              path: ${{ github.workspace }}

      - name: Get published binary (MacOS)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
              name: tgz-${{ inputs.mac_asset_suffix }}-binary
              path: ${{ github.workspace }}

      - name: Get published dmg binary (MacOS)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
              name: tgz-${{ inputs.mac_asset_suffix }}-dmg-binary
              path: ${{ github.workspace }}

      - name: Get published binary (Linux)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
              name: tgz-${{ inputs.ubuntu_asset_suffix }}-binary
              path: ${{ github.workspace }}

      - name: Get published deb binary (Linux)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
              name: deb-${{ inputs.ubuntu_asset_suffix }}-binary
              path: ${{ github.workspace }}

      - name: Get published rpm binary (Linux)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
              name: rpm-${{ inputs.ubuntu_asset_suffix }}-binary
              path: ${{ github.workspace }}

      - name: Create sha256 sums for files
        run: |
          sha256sum ${{ steps.get-file-base.outputs.FILE_BASE }}.tar.gz >> ${{ steps.get-file-base.outputs.FILE_BASE }}.sha256sums.txt
          sha256sum ${{ steps.get-file-base.outputs.FILE_BASE }}.zip >> ${{ steps.get-file-base.outputs.FILE_BASE }}.sha256sums.txt
          sha256sum ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.mac_asset_suffix }}.tar.gz >> ${{ steps.get-file-base.outputs.FILE_BASE }}.sha256sums.txt
          sha256sum ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.mac_asset_suffix }}.dmg >> ${{ steps.get-file-base.outputs.FILE_BASE }}.sha256sums.txt
          sha256sum ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.ubuntu_asset_suffix }}.tar.gz >> ${{ steps.get-file-base.outputs.FILE_BASE }}.sha256sums.txt
          sha256sum ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.ubuntu_asset_suffix }}.deb >> ${{ steps.get-file-base.outputs.FILE_BASE }}.sha256sums.txt
          sha256sum ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.ubuntu_asset_suffix }}.rpm >> ${{ steps.get-file-base.outputs.FILE_BASE }}.sha256sums.txt
          sha256sum ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.win_asset_suffix }}.zip >> ${{ steps.get-file-base.outputs.FILE_BASE }}.sha256sums.txt
          sha256sum ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.win_asset_suffix }}.msi >> ${{ steps.get-file-base.outputs.FILE_BASE }}.sha256sums.txt

      - name: Store snapshot name
        run: |
          echo "${{ steps.get-file-base.outputs.FILE_BASE }}" > ./last-file.txt

      - name: PreRelease tag
        id: create_prerelease
        if: ${{ (inputs.use_environ == 'snapshots') }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: "${{ inputs.use_tag }}"
          prerelease: true
          files: |
              last-file.txt
              ${{ steps.get-file-base.outputs.FILE_BASE }}.tar.gz
              ${{ steps.get-file-base.outputs.FILE_BASE }}.zip
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.mac_asset_suffix }}.tar.gz
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.mac_asset_suffix }}.dmg
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.ubuntu_asset_suffix }}.tar.gz
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.ubuntu_asset_suffix }}.deb
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.ubuntu_asset_suffix }}.rpm
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.win_asset_suffix }}.zip
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.win_asset_suffix }}.msi
              ${{ steps.get-file-base.outputs.FILE_BASE }}.sha256sums.txt
              if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`

      - name: Release tag
        id: create_release
        if: ${{ (inputs.use_environ == 'release') }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: "${{ inputs.use_tag }}"
          draft: true
          prerelease: false
          files: |
              ${{ steps.get-file-base.outputs.FILE_BASE }}.tar.gz
              ${{ steps.get-file-base.outputs.FILE_BASE }}.zip
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.mac_asset_suffix }}.tar.gz
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.mac_asset_suffix }}.dmg
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.ubuntu_asset_suffix }}.tar.gz
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.ubuntu_asset_suffix }}.deb
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.ubuntu_asset_suffix }}.rpm
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.win_asset_suffix }}.zip
              ${{ steps.get-file-base.outputs.FILE_BASE }}-${{ inputs.win_asset_suffix }}.msi
              ${{ steps.get-file-base.outputs.FILE_BASE }}.sha256sums.txt
              if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`

      - name: List files for the space (Linux)
        run: |
              ls -l ${{ github.workspace }}
              ls ${{ runner.workspace }}

